# Auto-suspend service + fleet load for the density experiment.
# Substitute ${AUTOSUSPENDER_IMAGE} and ${AGENTSIM_IMAGE} (envsubst; build.sh
# prints them) before applying, and deploy the glutton ActorTemplate first
# (substrate/benchmarking/workloads/deploy.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosuspender
  namespace: agent-sim
spec:
  replicas: 1
  selector:
    matchLabels: { app: autosuspender }
  template:
    metadata:
      labels: { app: autosuspender }
    spec:
      containers:
      - name: autosuspender
        image: ${AUTOSUSPENDER_IMAGE}
        args:
        - --atespace=agents-sim
        # Compressed-time policy: at --compress=60 in agentsim, 10s here plays
        # the role of a ~10min real-world idle window. Keep poll well under it.
        - --idle-timeout=${IDLE_TIMEOUT}
        - --unwedge-after=${UNWEDGE_AFTER}  # must exceed the slowest honest checkpoint
        - --poll=2s
        - --max-running=${MAX_RUNNING}
        - --max-concurrent=8
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        ports:
        - { name: http, containerPort: 8080 }
        volumeMounts:
        - { name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true }
        - { name: podidentity, mountPath: /run/podidentity.podcert.ate.dev, readOnly: true }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
      volumes:
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels: { podcert.ate.dev/canarying: live }
              path: ca.crt
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: autosuspender
  namespace: agent-sim
spec:
  selector: { app: autosuspender }
  ports:
  - { name: http, port: 8080, targetPort: 8080 }
---
# The simulated personal-agent fleet. Run after autosuspender is up:
#   kubectl -n agent-sim create -f - (or kubectl apply) ; then
#   kubectl -n agent-sim logs -f job/agentsim | tee run.log
apiVersion: batch/v1
kind: Job
metadata:
  name: agentsim
  namespace: agent-sim
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: agentsim }
    spec:
      restartPolicy: Never
      containers:
      - name: agentsim
        image: ${AGENTSIM_IMAGE}
        args:
        - --atespace=agents-sim
        - --agents=${AGENTS}
        - --compress=${COMPRESS}  # 60 = a day of behavior in 24 wall-clock minutes
        - --duration=${DURATION}
        - --sessions-per-day=${SESSIONS_PER_DAY}  # script mode: tasks per day
        - --session-minutes=8
        - --session-ping-seconds=30
        - --wakes-per-day=${WAKES_PER_DAY}
        # Workload: empty = personal-agent turns; a built-in script name or
        # the ConfigMap-mounted file = agent-session script (see lib.sh).
        - --script=${SCRIPT_ARG}
        - --think-scale=${THINK_SCALE}
        - --script-suspend=${SCRIPT_SUSPEND}
        - --script-loop=${SCRIPT_LOOP}
        - --ramp-seconds=${RAMP_SECONDS}
        # One-ping (GluttonUser loop) workload; 0 actors per user = off.
        - --ping-actors-per-user=${PING_ACTORS_PER_USER}
        - --ping-wait=${PING_WAIT}
        - --ping-live=${PING_LIVE}
        - --lifecycle-mode=${LIFECYCLE_MODE}   # suspend (bucket) | pause (node-local)
        - --ping-independent=${PING_INDEPENDENT}
        - --setup-concurrency=${SETUP_CONCURRENCY}
        - --cold-start-only=${COLD_START_ONLY}
        - --actor-prefix=${ACTOR_PREFIX}
        - --mem-target=${MEM_TARGET}   # working set filled at boot, snapshotted after
        - --mem-read=all               # page the working set back in on every wake
        - --mem-churn=${MEM_CHURN}     # dirty a rotating window every turn
        - --disk-bytes=65536      # file write every turn + digest read-back
        - --setup-suspend=${SETUP_SUSPEND}  # false = resident-parking design
        - --suspender-url=http://autosuspender.agent-sim.svc.cluster.local:8080
        # Load-test mode: waves of agents until failure thresholds trip
        # (no-op when false; agentsim defaults govern unset wave knobs).
        - --load-test=${LOAD_TEST}
        - --wave-start=${WAVE_START}
        - --wave-step=${WAVE_STEP}
        - --wave-interval=${WAVE_INTERVAL}
        - --fail-refusal-pct=${FAIL_REFUSAL_PCT}
        - --fail-error-pct=${FAIL_ERROR_PCT}
        - --fail-wake-p99-ms=${FAIL_WAKE_P99_MS}
        - --fail-turn-p99-ms=${FAIL_TURN_P99_MS}
        - --fail-rel-p90=${FAIL_REL_P90}
        - --fail-probe-p99-ms=${FAIL_PROBE_P99_MS}
        - --fail-mem-avail-pct=${FAIL_MEM_AVAIL_PCT}
        - --fail-psi-mem-full=${FAIL_PSI_MEM_FULL}
        - --fail-psi-cpu-some=${FAIL_PSI_CPU_SOME}
        - --fail-crashed=${FAIL_CRASHED}
        - --hold-after-fail=${HOLD_AFTER_FAIL}
        - --swap-fill=${SWAP_FILL}
        - --script-snapshot-steps=${SCRIPT_SNAPSHOT_STEPS}
        - --swap-start=${SWAP_START}
        - --swap-mult=${SWAP_MULT}
        - --swap-every=${SWAP_EVERY}
        - --swap-cycle-all=${SWAP_CYCLE_ALL}
        volumeMounts:
        - { name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true }
        - { name: podidentity, mountPath: /run/podidentity.podcert.ate.dev, readOnly: true }
        - { name: agent-script, mountPath: /etc/agentscript, readOnly: true }
        resources:
          # Reservation only; the client is light. Keep it small so it still
          # schedules on a node whose CPU is reserved by a dense worker pool.
          requests: { cpu: 50m, memory: 256Mi }
          limits: { cpu: "2", memory: 1Gi }
      volumes:
      # A user-supplied agent-session script (WORKLOAD=<path>.yaml); absent
      # for built-in workloads, hence optional.
      - name: agent-script
        configMap: { name: agent-script, optional: true }
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels: { podcert.ate.dev/canarying: live }
              path: ca.crt
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
