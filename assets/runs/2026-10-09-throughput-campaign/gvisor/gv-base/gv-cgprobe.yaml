apiVersion: v1
kind: Pod
metadata: {name: gv-cgprobe, namespace: kube-system}
spec:
  restartPolicy: Never
  hostPID: true
  priorityClassName: system-node-critical
  tolerations: [{operator: Exists}]
  containers:
  - name: p
    image: ubuntu:24.04
    imagePullPolicy: IfNotPresent
    securityContext: {privileged: true}
    volumeMounts: [{name: cg, mountPath: /host/sys/fs/cgroup}]
    command: ["sh", "-c", "R=/host/sys/fs/cgroup/gvprobe; mkdir -p $R; echo '+cpu +memory +pids' > $R/cgroup.subtree_control 2>/dev/null; ME=$(cat /proc/self/cgroup | sed 's/^0:://'); while true; do i=$((i+1)); d=$R/c$i; t0=$(date +%s%N); mkdir $d; t1=$(date +%s%N); echo 200000 100000 > $d/cpu.max; echo 2147483648 > $d/memory.max; t2=$(date +%s%N); sh -c \"echo \\$\\$ > $d/cgroup.procs; echo \\$\\$ > /host/sys/fs/cgroup$ME/cgroup.procs\" ; t3=$(date +%s%N); rmdir $d; t4=$(date +%s%N); echo \"T $(date +%s) mkdir_ms $(( (t1-t0)/1000000 )) limits_ms $(( (t2-t1)/1000000 )) attach2_ms $(( (t3-t2)/1000000 )) rmdir_ms $(( (t4-t3)/1000000 ))\"; sleep 1; done"]
  volumes: [{name: cg, hostPath: {path: /sys/fs/cgroup}}]
