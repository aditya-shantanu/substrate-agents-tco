apiVersion: v1
kind: Pod
metadata: {name: gv-debuglogs2, namespace: kube-system}
spec:
  restartPolicy: Never
  priorityClassName: system-node-critical
  tolerations: [{operator: Exists}]
  containers:
  - name: p
    image: busybox
    imagePullPolicy: IfNotPresent
    securityContext: {privileged: true}
    volumeMounts: [{name: ate, mountPath: /host/var/lib/ate, readOnly: true}]
    command: ["sh", "-c", "cd /host/var/lib/ate/actors; F=523fd179-4fa6-4f53-acdd-74e8387a23f2/runsc-debug-logs/runsc.log.20261009-085307.012861.create.txt; echo '=== FAILING create: lines mentioning cgroup/gofer/filestore/netns/chroot/exec'; grep -n -i -E 'cgroup|gofer|filestore|netns|network namespace|chroot|exec|clone|error|fatal|null' $F | grep -v 'config.go' | cut -c1-240 | head -60; echo; echo '=== FAILING create: last 25 lines'; tail -25 $F | cut -c1-240; echo; H=2f93fa18-c67e-4f55-8f1d-31883f817766/runsc-debug-logs/runsc.log.20261009-085306.271861.create.txt; echo '=== HEALTHY create: same grep'; grep -n -i -E 'cgroup|gofer|filestore|netns|network namespace|chroot|exec|clone|null' $H | grep -v 'config.go' | cut -c1-240 | head -60; echo DONE; sleep 900"]
  volumes: [{name: ate, hostPath: {path: /var/lib/ate}}]
