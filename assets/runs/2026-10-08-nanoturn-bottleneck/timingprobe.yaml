apiVersion: v1
kind: Pod
metadata: {name: timingprobe, namespace: kube-system}
spec:
  restartPolicy: Never
  priorityClassName: system-node-critical
  tolerations: [{operator: Exists}]
  containers:
  - name: p
    image: busybox
    imagePullPolicy: IfNotPresent
    securityContext: {privileged: true}
    volumeMounts: [{name: host, mountPath: /host}]
    command: ["sh", "-c", "cd /host/var/log/pods && find ate-system_atelet-* benchmark-workloads_benchmark-ateom-* -type f \\( -name '*.log' -o -name '*.gz' \\) 2>/dev/null | while read f; do case $f in *.gz) zcat $f;; *) cat $f;; esac; done | grep -E 'timing breakdown|Herder/(Restore|Checkpoint|Suspend|Snapshot)|Ateom/(Restore|Checkpoint|Suspend|Snapshot)' | sed -E 's/^[0-9T:.Z+-]+ (stdout|stderr) F //'"]
  volumes: [{name: host, hostPath: {path: /}}]
